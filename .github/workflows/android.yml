name: Android · APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Compilar APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Nombre del APK
        run: cp app/build/outputs/apk/release/app-release.apk "JSE-Captura-Android-$(grep versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/').apk"
      - uses: actions/upload-artifact@v4
        with:
          name: JSE-Captura-Android
          path: android/JSE-Captura-Android-*.apk
          retention-days: 30
